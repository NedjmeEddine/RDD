[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-rdd"
version = "0.1.0"
description = "Script-gated Broad Research-Driven Development (RDD) workflow for OpenCode V2"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/NedjmeEddine/RDD"

[project.scripts]
opencode-rdd = "opencode_rdd.cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "/opencode_rdd",
  "/.opencode/agents",
  "/.opencode/skills/research/SKILL.md",
  "/.opencode/skills/research/playbooks",
  "/.opencode/skills/research/scripts",
  "/opencode.json",
  "/README.md",
  "/LICENSE",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["opencode_rdd"]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
]

[tool.hatch.build.targets.wheel.force-include]
".opencode/agents" = "opencode_rdd/bundle/agents"
".opencode/skills/research/SKILL.md" = "opencode_rdd/bundle/skills/research/SKILL.md"
".opencode/skills/research/playbooks" = "opencode_rdd/bundle/skills/research/playbooks"
".opencode/skills/research/scripts" = "opencode_rdd/bundle/skills/research/scripts"
"opencode.json" = "opencode_rdd/bundle/opencode.json"
